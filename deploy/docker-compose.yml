version: '3.8'

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: cloudnotes_backend
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ../database/pb_data:/pb_data
      - ../database/files:/pb_data/storage
      - ../database/pb_public:/pb_public
      - ../database/pb_migrations:/pb_migrations
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - cloudnotes_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudnotes_tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-dummy_token_configure_in_env}
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - cloudnotes_network

networks:
  cloudnotes_network:
    driver: bridge
